name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('FinSightAI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json,sys
          devs=[d for rt in json.load(sys.stdin)['devices'].values() for d in rt if d['isAvailable']]
          print(devs[-1]['udid'])")
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -project FinSightAI.xcodeproj -scheme FinSightAI \
            -destination "$DESTINATION" -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: |
          xcodebuild -project FinSightAI.xcodeproj -scheme FinSightAI \
            -destination "$DESTINATION" -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO test
